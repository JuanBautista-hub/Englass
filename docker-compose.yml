services:
  mysql:
    image: mysql:8.0
    container_name: engclass-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: engclass
      MYSQL_USER: engclass
      MYSQL_PASSWORD: engclass
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - engclass_mysqldata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "engclass", "-pengclass"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  engclass_mysqldata:
