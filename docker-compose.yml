services:
  postgres:
    image: postgres:16-alpine
    container_name: engclass-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: engclass
      POSTGRES_PASSWORD: engclass
      POSTGRES_DB: engclass
    ports:
      - "5432:5432"
    volumes:
      - engclass_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U engclass -d engclass"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  engclass_pgdata:
